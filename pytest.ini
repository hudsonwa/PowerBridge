[pytest]
# Default pytest matches the portable public tier.
# real_world/ needs extra fixtures and is not the clone check.
testpaths = tests
norecursedirs = real_world
# Tests that need data or settings a contributor cannot supply from a clone
# (MultiCharts captures, audit tapes, the drawing corpus, a quiet machine for
# wall-clock checks) are deselected by default; select them with -m.
addopts = -m "not needs_captures and not perf"
markers =
    public_tier: the portable public tier (same members as tests/run_public_tier.py)
    needs_native: needs the native kernel (pl_transpiler._accel); left out of the run until tools/build_accel.sh has run
    needs_captures: needs MultiCharts captures, audit tapes or the drawing corpus (not redistributed); run with -m needs_captures
    perf: wall-clock check; run with PB_PERF=1 pytest -m perf
