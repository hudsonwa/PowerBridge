[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "powerbridge-accel"
version = "0.5.0"
description = "PowerBridge native bar-loop and fill-engine kernel extra"
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Joshua Hudson" }]
keywords = ["easylanguage", "powerlanguage", "multicharts", "tradestation", "transpiler", "backtesting", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hudsonwa/PowerBridge"
Documentation = "https://github.com/hudsonwa/PowerBridge/tree/main/docs"
Changelog = "https://github.com/hudsonwa/PowerBridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/hudsonwa/PowerBridge/issues"

[tool.maturin]
# Stable public names (renaming breaks installs and callers): extra name `accel`, import `pl_transpiler._accel`.
# `python-source` + the empty `python/pl_transpiler/` dir make this a mixed
# layout so the cdylib lands at `pl_transpiler/_accel*.so`. A pure-Rust crate
# with a dotted module-name is wrapped as top-level `_accel` by maturin 1.15.
module-name = "pl_transpiler._accel"
python-source = "python"
exclude = ["python/pl_transpiler/.gitkeep"]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
