[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "powerbridge-accel"
version = "0.2.0"
description = "PowerBridge native bar-loop and fill-engine kernel extra"
requires-python = ">=3.9"
license = "Apache-2.0"

[tool.maturin]
# Frozen by the supervisor: extra name `accel`, import `pl_transpiler._accel`.
# `python-source` + the empty `python/pl_transpiler/` dir make this a mixed
# layout so the cdylib lands at `pl_transpiler/_accel*.so`. A pure-Rust crate
# with a dotted module-name is wrapped as top-level `_accel` by maturin 1.15.
module-name = "pl_transpiler._accel"
python-source = "python"
exclude = ["python/pl_transpiler/.gitkeep"]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
