name: accel extra (CI + wheels)

# CI and wheels for the optional `accel` fast path.
#
# Product shape (locked by docs/ACCEL.md): core `dependencies = []`
# (pure stdlib); the fast path is the opt-in `[accel]` extra; the native
# module is `pl_transpiler._accel`; an absent extra is the documented normal
# state (ImportError -> callers fall back to the Python path loudly).
#
# What the jobs prove:
#   * accel-macos-arm64 — RUNS the accel path, not merely builds it: builds
#     the wheel with maturin, installs core + the wheel, imports the native
#     module from a NON-repo cwd (so the repo's source package cannot shadow
#     the installed .so), asserts ping() == 42, run_program is present and
#     the bars-only run() refuses with ACCEL_FALLBACK_REQUIRED, then runs the public test tier, the
#     differential conformance harness and the full pytest suite with the
#     kernel loaded. The job FAILS if the extra silently
#     does not load.
#   * core-no-accel — the extra is ABSENT: proves the zero-dependency promise
#     is itself tested (import raises ImportError, core tier stays green).
#
# Platform matrix: macOS arm64 is first-class (built + run here). Release
# wheels for the other platforms are built and smoke-tested by release.yml;
# nothing in this workflow claims a platform it does not build.

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Job 1: RUN the accel path on the machine class actually used (arm64 mac).
  # ---------------------------------------------------------------------
  accel-macos-arm64:
    name: accel (macOS arm64) — build + run the extra
    runs-on: macos-14   # Apple Silicon (arm64)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.0,<2.0"

      - name: Build the accel wheel (release)
        run: maturin build --release
        working-directory: accel

      - name: Install core with the pinned dev tools, then install the built wheel (the extra)
        run: |
          python -m pip install '.[dev]'
          python -m pip install accel/target/wheels/powerbridge_accel-*.whl

      - name: The extra MUST load (fail loudly if it silently does not)
        # Import from a cwd that is NOT the repo root: the repo's source
        # `pl_transpiler` would shadow the installed native module (the exact
        # trap documented in accel/README.md).
        run: |
          mkdir -p "$RUNNER_TEMP/accel-probe" && cd "$RUNNER_TEMP/accel-probe"
          python - <<'PY'
          import pl_transpiler._accel as accel
          assert accel.ping() == 42, 'ping() must return 42'
          assert callable(accel.run_program), 'run_program must be exposed'
          try:
              accel.run([], [], [], [], [], [], [])
          except NotImplementedError as exc:
              assert str(exc).startswith('ACCEL_FALLBACK_REQUIRED'), exc
          else:
              raise SystemExit('bars-only run() must refuse: it carries no program')
          print('OK: pl_transpiler._accel loads; ping()==42; run_program present; run() refuses')
          PY

      - name: Public test tier (extra installed)
        run: python3 tests/run_public_tier.py

      - name: Differential conformance harness + wheel-load gate
        # The python-vs-accel differential gate and the digest gate arm once
        # the kernel's execution boundary is stable; otherwise they skip cleanly from
        # the repo root (repo package shadows the installed module), exactly as their
        # authors designed. The wheel-load gate above is the load proof.
        run: python3 -m pytest tests/test_accel_conformance.py tests/test_accel_wheel.py tests/test_accel_digest_gate.py -q

      - name: Native-vs-Python digest gate (native path must be taken)
        # Independent gate: builds/installs the cdylib as its first step,
        # runs both paths, and compares the canonical digest — AND asserts the native
        # path was actually taken (a silent Python fallback is a FAIL, not a pass).
        run: python3 tools/accel_gate.py

      - name: Full pytest suite with the kernel loaded
        # Tests run from the repo root import the source package, so copy the
        # wheel's native module next to it; every CLI and engine test then
        # runs with the kernel present.
        run: |
          python -m zipfile -e accel/target/wheels/powerbridge_accel-*.whl "$RUNNER_TEMP/accel-wheel"
          cp "$RUNNER_TEMP"/accel-wheel/pl_transpiler/_accel*.so pl_transpiler/
          python -c 'import pl_transpiler._accel as a; assert a.ping() == 42'
          python -m pytest -q --timeout=60

      - name: Upload the macOS arm64 wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accel-macos-arm64-wheel
          path: accel/target/wheels/*.whl

  # ---------------------------------------------------------------------
  # Job 2: the extra is ABSENT — the zero-dependency promise is tested.
  # ---------------------------------------------------------------------
  core-no-accel:
    name: core (no accel) — zero-dep promise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install core WITHOUT the extra
        run: python -m pip install .

      - name: Extra absent -> import raises ImportError (loud fallback)
        run: |
          python - <<'PY'
          try:
              import pl_transpiler._accel
          except ImportError:
              print('OK: import pl_transpiler._accel raises ImportError without the extra')
          else:
              raise SystemExit('FAIL: the accel module imported WITHOUT the extra installed')
          PY

      - name: Zero third-party runtime dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as md
          # Opt-in extras (`extra == "accel"`) are not runtime dependencies.
          deps = [r for r in md.requires('powerbridge') or [] if 'extra ==' not in r]
          assert not deps, f'core must declare zero dependencies, got {deps}'
          print('OK: powerbridge declares zero third-party dependencies')
          PY

      - name: Public test tier (extra absent)
        run: python3 tests/run_public_tier.py

      - name: Differential conformance harness (extra absent -> differential gate skips)
        run: |
          python -m pip install '.[dev]'
          python3 -m pytest tests/test_accel_conformance.py tests/test_accel_wheel.py tests/test_accel_digest_gate.py -q