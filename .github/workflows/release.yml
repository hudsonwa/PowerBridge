name: release

# Builds the release artifacts and attaches them to a GitHub Release.
#
#   * release published  -> build, test the wheels, write SHA256SUMS, attest
#                           build provenance, attach everything to that
#                           GitHub Release, then publish both projects to PyPI
#                           (if PYPI_PUBLISH is `true`).
#   * workflow_dispatch  -> dry run: build and test the wheels and write
#                           SHA256SUMS; the files are kept as workflow
#                           artifacts. Nothing is attested, nothing is
#                           attached to a release and nothing goes to PyPI.
#   * workflow_dispatch with `tag` -> re-publish an existing release: nothing
#                           is rebuilt; the files already attached to that
#                           GitHub Release are uploaded to PyPI (if
#                           PYPI_PUBLISH is `true`).
#
# Artifacts:
#   powerbridge        sdist + pure wheel (py3-none-any)
#   powerbridge-accel  abi3 wheels (CPython >= 3.9) for macOS arm64, macOS
#                      x86_64, Windows x64, Linux x86_64 and Linux aarch64
#                      (manylinux)
#
# The PyPI jobs only run when the repository variable PYPI_PUBLISH is set to
# `true`; while it is unset or anything else, releases go to GitHub only.
#
# PyPI uses trusted publishing (OIDC) and needs no token or secret. Each
# project has its own job and GitHub environment (`pypi` for powerbridge,
# `pypi-accel` for powerbridge-accel), so each PyPI publisher matches exactly
# one job.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-publish to PyPI (e.g. v0.3.0). Leave empty for a dry-run build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  core:
    name: powerbridge sdist + wheel
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["TAG"].removeprefix("v")
          core = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          accel = tomllib.load(open("accel/pyproject.toml", "rb"))["project"]["version"]
          crate = tomllib.load(open("accel/Cargo.toml", "rb"))["package"]["version"]
          assert tag == core == accel == crate, f"tag {tag} vs core {core}, accel {accel}, crate {crate}"
          print(f"OK: version {tag}")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist .

      - name: Smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import pl_transpiler; print('OK: pl_transpiler imports')"
          "$RUNNER_TEMP/venv/bin/pl_transpile" --help > /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-core
          path: dist/*

  accel:
    name: powerbridge-accel (${{ matrix.name }})
    if: inputs.tag == ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: accel
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - name: Smoke-test the wheel
        # Run from outside the repo so the source `pl_transpiler` cannot
        # shadow the installed native module.
        shell: bash
        run: |
          python -m pip install accel/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import pl_transpiler._accel as a; assert a.ping() == 42; print('OK: ping() == 42')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-accel-${{ matrix.name }}
          path: accel/dist/*.whl

  test-core:
    name: test powerbridge wheel (public tier)
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-core
          path: dist

      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl

      - name: Public tier against the installed package
        # The tier puts the repo root on sys.path and some members read
        # package files by path, so the source package is replaced by a
        # link to the installed one: every import and every file read then
        # comes from the wheel.
        run: |
          site=$(cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -c "import pathlib, pl_transpiler; print(pathlib.Path(pl_transpiler.__file__).parent)")
          case "$site" in *site-packages*) ;; *) echo "pl_transpiler not from the wheel: $site"; exit 1;; esac
          rm -rf pl_transpiler
          ln -s "$site" pl_transpiler
          "$RUNNER_TEMP/venv/bin/python" tests/run_public_tier.py

  test-accel:
    name: test powerbridge-accel wheel (${{ matrix.name }})
    needs: [core, accel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x64, os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-core
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-accel-${{ matrix.name }}
          path: dist

      - name: Native-vs-Python digest on the examples
        # Runs from outside the repo so only the installed wheels are
        # imported. The native run must take the native path and give the
        # same digest as the pure-Python run.
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then py="$RUNNER_TEMP/venv/Scripts/python.exe"; else py="$RUNNER_TEMP/venv/bin/python"; fi
          "$py" -m pip install dist/powerbridge-*.whl dist/powerbridge_accel-*.whl
          ex="$GITHUB_WORKSPACE/examples"
          cd "$RUNNER_TEMP"
          for el in "$ex"/*.el; do
            "$py" -m pl_transpiler.tools.pl_oracle "$el" "$ex/NQ_sample_bars.csv" --native -q -o native.txt 2> native.err
            cat native.err
            grep -q '\[native\]' native.err || { echo "FAIL: $el did not take the native path"; exit 1; }
            "$py" -m pl_transpiler.tools.pl_oracle "$el" "$ex/NQ_sample_bars.csv" --python -q -o python.txt
            diff native.txt python.txt || { echo "FAIL: $el native and Python digests differ"; exit 1; }
            echo "OK: $el digests match"
          done

  # SHA256SUMS covers every sdist and wheel. It is written on every build
  # (a dry run keeps it as a workflow artifact so it can be checked).
  checksums:
    name: SHA256SUMS
    needs: [core, accel, test-core, test-accel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.whl > ../SHA256SUMS
          cat ../SHA256SUMS
          test "$(wc -l < ../SHA256SUMS)" -eq "$(ls -1 | wc -l)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sha256sums
          path: SHA256SUMS

  github-release:
    name: attest and attach to GitHub Release
    if: github.event_name == 'release'
    needs: [core, accel, test-core, test-accel, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sha256sums
          path: dist

      - name: Check SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber

  # The publish jobs take their files from the GitHub Release, so a release
  # event and a re-publish by tag upload exactly the same files.
  pypi:
    name: publish powerbridge to PyPI
    needs: [github-release, test-core, test-accel]
    if: >-
      always() && vars.PYPI_PUBLISH == 'true' &&
      ((github.event_name == 'release' && needs.github-release.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download powerbridge from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --dir dist --pattern 'powerbridge-*'
          ls -l dist

      - name: Publish powerbridge
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  pypi-accel:
    name: publish powerbridge-accel to PyPI
    needs: [github-release, test-core, test-accel]
    if: >-
      always() && vars.PYPI_PUBLISH == 'true' &&
      ((github.event_name == 'release' && needs.github-release.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment:
      name: pypi-accel
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download powerbridge-accel from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --dir dist --pattern 'powerbridge_accel-*'
          ls -l dist

      - name: Publish powerbridge-accel
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
