name: Public tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  public-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run public test tier
        run: python3 tests/run_public_tier.py

  # The same tier on every supported OS and the oldest/newest Python. f32 and
  # struct overflow behaviour changed in 3.13; this is what catches that class.
  public-tier-matrix:
    name: public tier (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run public test tier
        run: python tests/run_public_tier.py

  # The default pytest suite (pytest.ini) covers tests/generated and other pytest-only
  # tests that the public tier does not run.
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: python -m pip install . pytest pytest-timeout pytest-cov
      - name: Run pytest
        if: matrix.python != '3.13'
        run: python -m pytest -q --timeout=60
      # Coverage on one interpreter only: a terminal summary in the log plus the
      # XML report as a downloadable artifact.
      - name: Run pytest with coverage
        if: matrix.python == '3.13'
        run: python -m pytest -q --timeout=60 --cov=pl_transpiler --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml


  # el_emit's name check must work from the installed wheel, with no repo on disk: build the
  # wheel, install it in a fresh venv and run the usage guide's el_emit examples from a temp dir.
  installed-el-emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Run the usage guide's el_emit examples outside the repo
        run: |
          mkdir "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" - "$GITHUB_WORKSPACE/ground_truth" <<'PYEOF'
          import sys
          from pl_transpiler import transpile
          gt = sys.argv[1]
          for name, src in [("GT2", "GT2_strategy_orders_position"), ("GT1", "GT1_functions_indicators")]:
              with open(f"{gt}/{src}.txt") as fh:
                  el = fh.read()
              with open(f"{name}_mirror.py", "w") as fh:
                  fh.write(transpile(el, dialect="mirror", trace=False))
          # Fail-closed check: Variance is not in the proven list.
          with open("unproven_mirror.py", "w") as fh:
              fh.write(transpile("Vars: v(0);\nv = Variance(Close, 10, 1);\nPlot1(v);\n", dialect="mirror", trace=False))
          PYEOF
          set +e
          "$RUNNER_TEMP/venv/bin/el_emit" GT2_mirror.py -o GT2_from_python.txt > gt2.out; rc2=$?
          "$RUNNER_TEMP/venv/bin/el_emit" GT1_mirror.py -o GT1_from_python.txt > gt1.out; rc1=$?
          "$RUNNER_TEMP/venv/bin/el_emit" unproven_mirror.py -o unproven_from_python.txt > bad.out; rcb=$?
          set -e
          cat gt2.out gt1.out bad.out
          printf '%s\n' \
            'GT2_from_python.txt: 26 builtins used | 26 PROVEN | 0 NOT-PROVEN | 0 ARITY-BAD | 0 RETURN-TYPE-BAD | 0 ARG-TYPE-BAD' \
            'OK -- every builtin used is known to compile in MultiCharts (names, argument counts, return types).' > want.txt
          head -n 2 gt2.out | diff want.txt -
          test "$rc2" -eq 0
          grep -q '^GT1_from_python.txt: 44 builtins used | 44 PROVEN | 0 NOT-PROVEN' gt1.out
          test "$rc1" -eq 0
          grep -q '^  variance$' bad.out
          test "$rcb" -eq 1

  # Runs the contributor setup from CONTRIBUTING.md verbatim on Python 3.9, starting from
  # the old pip that ships with it, so the documented commands keep working.
  contributor-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Fresh venv with Python 3.9's bundled pip
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install 'pip<21.3'
      - name: Documented setup
        run: |
          . /tmp/venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev]'
      - name: Smoke test
        run: |
          . /tmp/venv/bin/activate
          cd /tmp
          python3 -c "import pl_transpiler"
          pl_oracle --version

  # Type-checks the whole pl_transpiler package; settings live in pyproject.toml ([tool.mypy]).
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install mypy
        run: python -m pip install mypy
      - name: mypy
        run: mypy

  # Rule set lives in pyproject.toml ([tool.ruff]).
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check .

  # The accel crate is an OPTIONAL extra, so nothing above touches it. That is exactly how a
  # branch got merged carrying 17 rustfmt diffs with every gate green: no job ever ran on it.
  #
  # Two jobs, deliberately split:
  #   - rustfmt and clippy are pure *checks* (no linking), so they run on the cheap Linux runner.
  #   - build and test run on macOS, because this crate is a cdylib with pyo3's
  #     `extension-module` enabled unconditionally, which does NOT link libpython. On macOS that
  #     is fine; on Linux a linked test binary would fail on unresolved Python symbols. macOS is
  #     also where the crate is actually built and shipped, so it is the honest place to test it.
  accel-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings

  accel-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: accel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # The parity tests drive Python's run_oracle as the reference, so they need an interpreter
      # and the repo on the import path -- both already true on the runner.
      - name: cargo build --release
        run: cargo build --release
      - name: cargo test
        run: cargo test

  # Native-vs-Python parity on more than one interpreter. The kernel has to copy
  # behaviour that changes between Python versions (sum() became compensated in 3.12
  # and compensated ints too in 3.14, #124), so the extension is built for each
  # interpreter here and the accel tests run with it loaded. A silent fallback or
  # a missing build fails the job instead of skipping the tests.
  accel-parity:
    name: accel parity (macOS arm64, Python ${{ matrix.python }})
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install package and test tools
        run: python -m pip install . pytest pytest-timeout
      - name: Build the extension for this interpreter
        run: PYTHON=python tools/build_accel.sh
      - name: The extension must load
        run: python -c 'import pl_transpiler._accel as a; assert a.ping() == 42'
      - name: Native-vs-Python accel tests
        run: python -m pytest -q --timeout=60 tests/test_accel_*.py
      - name: Other tests that need the native kernel
        run: python -m pytest -q --timeout=60 -m needs_native
