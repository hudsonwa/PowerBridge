name: Public tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run public test tier
        run: python3 tests/run_public_tier.py

  # The same tier on every supported OS and the oldest/newest Python. f32 and
  # struct overflow behaviour changed in 3.13; this is what catches that class.
  public-tier-matrix:
    name: public tier (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run public test tier
        run: python tests/run_public_tier.py

  # The default pytest suite (pytest.ini) covers tests/generated and other pytest-only
  # tests that the public tier does not run.
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: python -m pip install . pytest pytest-timeout
      - name: Run pytest
        run: python -m pytest -q --timeout=60

  # el_emit's name check must work from the installed wheel, with no repo on disk: build the
  # wheel, install it in a fresh venv and run the README's el_emit examples from a temp dir.
  installed-el-emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
      - name: Run the README's el_emit examples outside the repo
        run: |
          mkdir "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" - "$GITHUB_WORKSPACE/ground_truth" <<'PYEOF'
          import sys
          from pl_transpiler import transpile
          gt = sys.argv[1]
          for name, src in [("GT2", "GT2_strategy_orders_position"), ("GT1", "GT1_functions_indicators")]:
              with open(f"{gt}/{src}.txt") as fh:
                  el = fh.read()
              with open(f"{name}_mirror.py", "w") as fh:
                  fh.write(transpile(el, trace=False))
          PYEOF
          set +e
          "$RUNNER_TEMP/venv/bin/el_emit" GT2_mirror.py -o GT2_from_python.txt > gt2.out; rc2=$?
          "$RUNNER_TEMP/venv/bin/el_emit" GT1_mirror.py -o GT1_from_python.txt > gt1.out; rc1=$?
          set -e
          cat gt2.out gt1.out
          printf '%s\n' \
            'GT2_from_python.txt: 26 builtins used | 26 PROVEN | 0 NOT-PROVEN | 0 ARITY-BAD | 0 RETURN-TYPE-BAD' \
            'OK -- every builtin used is known to compile in MultiCharts (names, argument counts, return types).' > want.txt
          head -n 2 gt2.out | diff want.txt -
          test "$rc2" -eq 0
          grep -q 'NOT-PROVEN' gt1.out
          grep -q 'atr, roc, stddev' gt1.out
          test "$rc1" -eq 1

  # Rule set lives in pyproject.toml ([tool.ruff]).
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check .

  # The accel crate is an OPTIONAL extra, so nothing above touches it. That is exactly how a
  # branch got merged carrying 17 rustfmt diffs with every gate green: no job ever ran on it.
  #
  # Two jobs, deliberately split:
  #   - rustfmt and clippy are pure *checks* (no linking), so they run on the cheap Linux runner.
  #   - build and test run on macOS, because this crate is a cdylib with pyo3's
  #     `extension-module` enabled unconditionally, which does NOT link libpython. On macOS that
  #     is fine; on Linux a linked test binary would fail on unresolved Python symbols. macOS is
  #     also where the crate is actually built and shipped, so it is the honest place to test it.
  accel-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings

  accel-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: accel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The parity tests drive Python's run_oracle as the reference, so they need an interpreter
      # and the repo on the import path -- both already true on the runner.
      - name: cargo build --release
        run: cargo build --release
      - name: cargo test
        run: cargo test
