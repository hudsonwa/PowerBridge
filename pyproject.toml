[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbridge"
version = "0.4.0.dev0"
description = "Bidirectional EasyLanguage/PowerLanguage to Python transpiler for MultiCharts and TradeStation."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Pure-stdlib: the transpiler, emitter, runtime and gates import nothing off PyPI.
dependencies = []

[project.urls]
Homepage = "https://github.com/hudsonwa/PowerBridge"
Repository = "https://github.com/hudsonwa/PowerBridge"

[project.optional-dependencies]
# OPTIONAL FAST PATH — decision record: docs/ACCEL.md. Strictly additive.
# Interface frozen across the kernel, CI and test code; do not rename:
#   extra name    -> `accel`        (pip install .[accel])
#   native module -> `pl_transpiler._accel`
#   extra absent  -> `import pl_transpiler._accel` raises ImportError; callers fall
#                    back to the Python path LOUDLY and produce identical results
#                    (fail-loud: never a silent different answer).
#
# The core `dependencies` list above stays [] and the default `pip install .`
# remains pure-stdlib, zero-dependency, with no build step. This extra is
# opt-in only. The native wheel, powerbridge-accel, is published separately to PyPI
# by release.yml; keep this pin equal to `version`.
accel = ["powerbridge-accel==0.4.0.dev0"]

[project.scripts]
# `python3 -m pl_transpiler.tools.el_emit` / `.pl_run` / `.pl_transpile` / `.pl_oracle`
# still work as modules; these give the same entrypoints as installed console
# commands (each main(argv=None) -> rc).
el_emit = "pl_transpiler.tools.el_emit:main"
pl_run = "pl_transpiler.tools.pl_run:main"
pl_transpile = "pl_transpiler.tools.pl_transpile:main"
pl_oracle = "pl_transpiler.tools.pl_oracle:main"

[tool.setuptools.packages.find]
# Only the library package (and its subpackages, e.g. pl_transpiler.runtime and
# pl_transpiler.tools) ships in the wheel; tests/ and scripts/ are NOT packaged.
include = ["pl_transpiler*"]

[tool.setuptools.package-data]
# The keyword catalog, verified-builtins list and proven-token data load __file__-relative
# from the tools subpackage, so they must ride along inside the wheel.
"pl_transpiler.tools" = ["pl_signatures.jsonl", "mc_verified_builtins.txt", "mc_proven.json"]

[tool.ruff]
# Lint only; no formatter is enforced. emitted/ and tests/generated/ hold
# machine-generated output, so they are not linted.
target-version = "py39"
extend-exclude = ["emitted", "tests/generated", "accel/target"]

[tool.ruff.lint]
# Conservative set: syntax errors (E9) and pyflakes (F) only.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Populated at import time from the runtime's pl_* functions via globals().
"pl_transpiler/builtins.py" = ["F821"]
# Package re-export of the runtime's public names.
"pl_transpiler/runtime/__init__.py" = ["F401", "F403"]
