[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbridge"
version = "0.10.0"
description = "Bidirectional EasyLanguage/PowerLanguage to Python transpiler for MultiCharts and TradeStation."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Joshua Hudson" }]
keywords = ["easylanguage", "powerlanguage", "multicharts", "tradestation", "transpiler", "backtesting", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Compilers",
]
# Pure-stdlib: the transpiler, emitter, runtime and gates import nothing off PyPI.
dependencies = []

[project.urls]
Homepage = "https://github.com/hudsonwa/PowerBridge"
Documentation = "https://github.com/hudsonwa/PowerBridge/tree/main/docs"
Changelog = "https://github.com/hudsonwa/PowerBridge/blob/main/CHANGELOG.md"
Issues = "https://github.com/hudsonwa/PowerBridge/issues"
Repository = "https://github.com/hudsonwa/PowerBridge"

[project.optional-dependencies]
# OPTIONAL FAST PATH — decision record: docs/ACCEL.md. Strictly additive.
# Stable interface shared by the kernel, CI and tests (renaming breaks installs):
#   extra name    -> `accel`        (resolves only once powerbridge-accel is on PyPI)
#   native module -> `pl_transpiler._accel`
#   extra absent  -> `import pl_transpiler._accel` raises ImportError; callers fall
#                    back to the Python path LOUDLY and produce identical results
#                    (fail-loud: never a silent different answer).
#
# The core `dependencies` list above stays [] and the default `pip install .`
# remains pure-stdlib, zero-dependency, with no build step. This extra is
# opt-in only. The native wheel, powerbridge-accel, is not on PyPI yet, so
# `pip install .[accel]` fails today: install the wheel from the GitHub Release
# or build accel/ from source (docs/ACCEL.md "Install"). release.yml will publish
# it to PyPI; keep this pin equal to `version`.
accel = ["powerbridge-accel==0.10.0"]

# Development tools only (tests, lint, type check, wheel build); never imported by the package.
# ruff, mypy, pytest and pytest-timeout are pinned so a contributor gets the same results as
# CI, which installs this extra. mypy 2 and pytest 9 need Python 3.10, so 3.9 gets the last
# release of each that supports it; mypy is clean on both pins.
dev = [
    "pytest==8.4.2; python_version < '3.10'",
    "pytest==9.1.1; python_version >= '3.10'",
    "pytest-timeout==2.4.0",
    "build",
    "setuptools>=77",
    "ruff==0.17.2",
    "mypy==1.19.1; python_version < '3.10'",
    "mypy==2.4.0; python_version >= '3.10'",
]

[project.scripts]
# `python3 -m pl_transpiler.tools.el_emit` / `.pl_run` / `.pl_transpile` / `.pl_oracle`
# still work as modules; these give the same entrypoints as installed console
# commands (each main(argv=None) -> rc).
el_emit = "pl_transpiler.tools.el_emit:main"
pl_run = "pl_transpiler.tools.pl_run:main"
pl_transpile = "pl_transpiler.tools.pl_transpile:main"
pl_oracle = "pl_transpiler.tools.pl_oracle:main"
pl_examples = "pl_transpiler.tools.pl_examples:main"

[tool.setuptools]
# Only the library package and its subpackages ship in the wheel; tests/ and
# scripts/ are NOT packaged. pl_transpiler._examples is a data-only package
# holding copies of the README quickstart files from examples/ (kept identical
# by tests/test_pl_examples.py), so `pl_examples` can write them after a wheel
# install.
packages = ["pl_transpiler", "pl_transpiler.runtime", "pl_transpiler.tools", "pl_transpiler._examples"]

[tool.setuptools.package-data]
# py.typed marks the package as typed (PEP 561).
"pl_transpiler" = ["py.typed"]
# Exactly the two README quickstart files.
"pl_transpiler._examples" = ["ma_cross.el", "NQ_sample_bars.csv"]
# The keyword catalog, verified-builtins list and proven-token data load __file__-relative
# from the tools subpackage, so they must ride along inside the wheel.
"pl_transpiler.tools" = ["pl_signatures.jsonl", "pl_signatures.schema.json", "mc_verified_builtins.txt", "mc_proven.json"]

[tool.mypy]
# Type-checks the whole pl_transpiler package (CI job "mypy").
files = ["pl_transpiler"]
follow_imports = "normal"
warn_unused_ignores = true
# Stricter checks that pass across the whole package (no per-module
# exceptions). Modules that are fully annotated also get disallow_untyped_defs
# in the override below; the rest (the runtime builtins and two maintainer
# tools) are typed incrementally.
check_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
extra_checks = true
warn_return_any = true
no_implicit_reexport = true
# Three classes subclass a bare builtin/ABC (SeriesHistory(list), SeriesState(dict),
# BarTape(Sequence)) and carry a narrow `type: ignore[type-arg]`: parameterising
# the base would change the runtime class bases.
disallow_any_generics = true

[[tool.mypy.overrides]]
# Fully annotated modules: every new function must be annotated too.
module = [
    "pl_transpiler",
    "pl_transpiler._codegen_el_layout",
    "pl_transpiler._engine_report",
    "pl_transpiler._engine_stops",
    "pl_transpiler._parser_expr",
    "pl_transpiler._parser_stmts",
    "pl_transpiler._py_front_common",
    "pl_transpiler._py_front_expr",
    "pl_transpiler._types",
    "pl_transpiler.bar_loop",
    "pl_transpiler.catalog",
    "pl_transpiler.codegen",
    "pl_transpiler.codegen_el",
    "pl_transpiler.codegen_expr",
    "pl_transpiler.codegen_stmt",
    "pl_transpiler.codegen_tables",
    "pl_transpiler.codegen_util",
    "pl_transpiler.engine",
    "pl_transpiler.engine_dates",
    "pl_transpiler.errors",
    "pl_transpiler.ir",
    "pl_transpiler.lexer",
    "pl_transpiler.lookback",
    "pl_transpiler.oracle",
    "pl_transpiler.parser",
    "pl_transpiler.parser_tables",
    "pl_transpiler.py_front",
    "pl_transpiler.reverse",
    "pl_transpiler.run",
    "pl_transpiler.semantic",
    "pl_transpiler.runtime.accel",
    "pl_transpiler.runtime.audit_packet",
    "pl_transpiler.runtime.bar_tape",
    "pl_transpiler.runtime.drawing_dump",
    "pl_transpiler.runtime.instrument_config",
    "pl_transpiler.tools._cli",
    "pl_transpiler.tools.el_emit",
    "pl_transpiler.tools.pl_examples",
    "pl_transpiler.tools.pl_oracle",
    "pl_transpiler.tools.pl_run",
    "pl_transpiler.tools.pl_transpile",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Optional compiled extension; absent unless built with tools/build_accel.sh.
module = "pl_transpiler._accel"
ignore_missing_imports = true

[tool.ruff]
# Lint only. ruff format is deliberately not adopted: it would rewrite most
# lines of the engine and runtime for no behaviour gain. tests/fixtures/emitted/
# and tests/generated/ hold machine-generated output, so they are not linted.
target-version = "py39"
extend-exclude = ["tests/fixtures/emitted", "tests/generated", "accel/target", "out"]

[tool.ruff.lint]
# pycodestyle errors (imports E4, statements E7, syntax E9), warnings (W) and
# pyflakes (F). Line length (E501) is not enforced: there is no formatter.
# Also import sorting (I), pyupgrade (UP) and bugbear (B).
select = ["E4", "E7", "E9", "W", "F", "I", "UP", "B"]
# E701/E702/E731/E741: established style in the engine and runtime.
# UP007/UP045: `X | None` needs Python 3.10 at runtime; the target is 3.9 and
# the public API annotations are evaluated.
# UP031: printf-style formatting is mostly report/CLI text; rewriting it risks
# output-format drift for no gain.
ignore = ["E701", "E702", "E731", "E741", "UP007", "UP045", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["pl_transpiler"]

[tool.ruff.lint.per-file-ignores]
# Checkout-only scripts (not installed) put the repo on sys.path before importing
# the package; the installed package itself never touches sys.path.
"tests/**" = ["E402"]
"tools/**" = ["E402"]
"scripts/**" = ["E402"]
# Package re-export of the runtime's public names. Import order is behaviour
# here and in pl_runtime.py (star-import precedence, loud stubs last), so
# neither is import-sorted.
"pl_transpiler/runtime/__init__.py" = ["F401", "F403", "I001"]
"pl_transpiler/runtime/pl_runtime.py" = ["I001"]
# Mirror-dialect source: the star import and _orders/_risk names are the dialect.
"examples/hand_written.py" = ["F403", "F405"]
# Trailing whitespace inside string literals is content, not style.
"pl_transpiler/engine_dates.py" = ["W293"]
"tests/run_gt.py" = ["W293"]
# Asserts the stored value is exactly True, not merely truthy.
"tests/real_world/test_comprehensive.py" = ["E712"]
