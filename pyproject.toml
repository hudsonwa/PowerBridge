[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-transpiler"
version = "0.1.0"
description = "Bidirectional EasyLanguage/PowerLanguage to Python transpiler for MultiCharts and TradeStation."
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Pure-stdlib: the transpiler, emitter, runtime and gates import nothing off PyPI.
dependencies = []

[project.urls]
Homepage = "https://github.com/hudsonwa/PowerBridge"
Repository = "https://github.com/hudsonwa/PowerBridge"

[project.scripts]
# `python3 -m pl_transpiler.tools.el_emit` / `.pl_run` still work as modules; these
# give the same two entrypoints as installed console commands (both main(argv=None) -> rc).
el_emit = "pl_transpiler.tools.el_emit:main"
pl_run = "pl_transpiler.tools.pl_run:main"
pl_transpile = "pl_transpiler.tools.pl_transpile:main"

[tool.setuptools.packages.find]
# Only the library package (and its subpackages, e.g. pl_transpiler.runtime and
# pl_transpiler.tools) ships in the wheel; tests/ and scripts/ are NOT packaged.
include = ["pl_transpiler*"]

[tool.setuptools.package-data]
# The keyword catalog + verified-builtins list load __file__-relative from the tools
# subpackage, so they must ride along inside the wheel.
"pl_transpiler.tools" = ["pl_signatures.jsonl", "mc_verified_builtins.txt"]
